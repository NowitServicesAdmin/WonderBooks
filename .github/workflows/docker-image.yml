
name: Deploy WonderBooks to New EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t wonderbooks-backend:latest \
            ./Backend

      - name: Build frontend image
        run: |
          docker build \
            -t wonderbooks-frontend:latest \
            ./frontend

      - name: Save Docker images
        run: |
          docker save \
            wonderbooks-backend:latest \
            wonderbooks-frontend:latest \
            -o wonderbooks-images.tar

      - name: Copy images to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "wonderbooks-images.tar"
          target: "/home/ubuntu/"

      - name: Deploy containers on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            docker load \
              -i /home/ubuntu/wonderbooks-images.tar

            # Replace the old application containers
            docker rm -f wonderbooks-backend || true
            docker rm -f wonderbooks-frontend || true

            # Start backend using its existing environment file
            docker run -d \
              --name wonderbooks-backend \
              --restart unless-stopped \
              --env-file /home/ubuntu/WonderBooks/Backend/.env \
              -p 127.0.0.1:5000:5000 \
              wonderbooks-backend:latest

            # Start frontend
            docker run -d \
              --name wonderbooks-frontend \
              --restart unless-stopped \
              -p 5173:80 \
              wonderbooks-frontend:latest

            rm -f /home/ubuntu/wonderbooks-images.tar

            docker ps
