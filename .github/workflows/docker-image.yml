
name: WonderBooks CI-CD Docker Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Create backend Dockerfile
      - name: Create backend Dockerfile
        run: |
          cat > Backend/Dockerfile <<'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY . .
          EXPOSE 5000
          CMD ["node", "app.js"]
          EOF

      # 3. Create frontend Dockerfile
      - name: Create frontend Dockerfile
        run: |
          cat > frontend/Dockerfile <<'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci
          COPY . .
          EXPOSE 5173
          CMD ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
          EOF

      # 4. Build backend image
      - name: Build backend image
        run: |
          docker build \
            -f Backend/Dockerfile \
            -t wonderbooks-backend:latest \
            ./Backend

      # 5. Build frontend image
      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t wonderbooks-frontend:latest \
            ./frontend

      # 6. Save images
      - name: Save Docker images
        run: |
          docker save \
            wonderbooks-backend:latest \
            wonderbooks-frontend:latest \
            -o wonderbooks-images.tar

      # 7. Install host dependencies on NEW EC2
      - name: Prepare EC2 server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Updating Ubuntu packages..."
            sudo apt-get update

            echo "Installing Docker, Nginx and required tools..."
            sudo apt-get install -y \
              docker.io \
              nginx \
              ca-certificates \
              curl \
              gnupg

            echo "Installing Node.js 20 and npm..."
            curl -fsSL https://deb.nodesource.com/setup_20.x \
              -o /tmp/nodesource_setup.sh
            sudo bash /tmp/nodesource_setup.sh
            sudo apt-get install -y nodejs
            rm -f /tmp/nodesource_setup.sh

            echo "Enabling services..."
            sudo systemctl enable --now docker
            sudo systemctl enable --now nginx

            echo "Checking installed dependencies..."
            docker --version
            node --version
            npm --version
            nginx -v

            echo "EC2 dependencies installed successfully."

      # 8. Transfer Docker images
      - name: Transfer images to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "wonderbooks-images.tar"
          target: "/home/ubuntu/"

      # 9. Deploy containers and configure Nginx
      - name: Deploy WonderBooks
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Loading Docker images..."
            sudo docker load -i /home/ubuntu/wonderbooks-images.tar

            echo "Checking backend environment file..."
            if [ ! -f /home/ubuntu/WonderBooks/Backend/.env ]; then
              echo "WARNING: Backend .env file is missing."
              echo "Ensure backend environment variables are configured."
            fi

            echo "Removing old WonderBooks containers..."
            sudo docker rm -f wonderbooks-backend || true
            sudo docker rm -f wonderbooks-frontend || true

            echo "Starting backend..."
            if [ -f /home/ubuntu/WonderBooks/Backend/.env ]; then
              sudo docker run -d \
                --name wonderbooks-backend \
                --restart unless-stopped \
                --env-file /home/ubuntu/WonderBooks/Backend/.env \
                -p 5000:5000 \
                wonderbooks-backend:latest
            else
              sudo docker run -d \
                --name wonderbooks-backend \
                --restart unless-stopped \
                -p 5000:5000 \
                wonderbooks-backend:latest
            fi

            echo "Starting frontend..."
            sudo docker run -d \
              --name wonderbooks-frontend \
              --restart unless-stopped \
              -p 127.0.0.1:5173:5173 \
              wonderbooks-frontend:latest

            echo "Configuring Nginx reverse proxy..."
            sudo tee /etc/nginx/sites-available/default > /dev/null <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;

                server_name _;

                location /api/ {
                    proxy_pass http://127.0.0.1:5000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location / {
                    proxy_pass http://127.0.0.1:5173;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_cache_bypass $http_upgrade;
                }
            }
            NGINX

            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl restart nginx

            echo "Waiting for application startup..."
            sleep 10

            echo "Checking container status..."
            sudo docker ps -a

            echo "Checking backend logs..."
            sudo docker logs --tail 50 wonderbooks-backend

            echo "Checking frontend logs..."
            sudo docker logs --tail 50 wonderbooks-frontend

            echo "Checking local HTTP response..."
            curl -I --max-time 10 http://127.0.0.1/ || true

            echo "Cleaning transferred archive..."
            rm -f /home/ubuntu/wonderbooks-images.tar

            echo "WonderBooks deployment workflow completed."
