
name: WonderBooks Docker Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build backend image using Backend/Dockerfile
      - name: Build backend Docker image
        run: |
          docker build \
            -f Backend/Dockerfile \
            -t wonderbooks-backend:latest \
            ./Backend

      # 3. Build frontend image using frontend/Dockerfile
      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t wonderbooks-frontend:latest \
            ./frontend

      # 4. Save both images into one archive
      - name: Save Docker images
        run: |
          docker save \
            wonderbooks-backend:latest \
            wonderbooks-frontend:latest \
            -o wonderbooks-images.tar

      # 5. Transfer images directly to the new EC2
      - name: Copy Docker images to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "wonderbooks-images.tar"
          target: "/home/ubuntu/"

      # 6. Load images and deploy containers on EC2
      - name: Deploy Docker containers on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Loading Docker images..."
            sudo docker load \
              -i /home/ubuntu/wonderbooks-images.tar

            echo "Stopping old containers..."
            sudo docker rm -f wonderbooks-backend || true
            sudo docker rm -f wonderbooks-frontend || true

            echo "Starting backend container..."

            if [ -f /home/ubuntu/WonderBooks/Backend/.env ]; then
              sudo docker run -d \
                --name wonderbooks-backend \
                --restart unless-stopped \
                --env-file /home/ubuntu/WonderBooks/Backend/.env \
                -p 5000:5000 \
                wonderbooks-backend:latest
            else
              sudo docker run -d \
                --name wonderbooks-backend \
                --restart unless-stopped \
                -p 5000:5000 \
                wonderbooks-backend:latest
            fi

            echo "Starting frontend container..."
            sudo docker run -d \
              --name wonderbooks-frontend \
              --restart unless-stopped \
              -p 5173:5173 \
              wonderbooks-frontend:latest

            echo "Waiting for containers to start..."
            sleep 5

            echo "Container status:"
            sudo docker ps -a

            echo "Backend logs:"
            sudo docker logs --tail 50 wonderbooks-backend

            echo "Frontend logs:"
            sudo docker logs --tail 50 wonderbooks-frontend

            echo "Removing transferred archive..."
            rm -f /home/ubuntu/wonderbooks-images.tar

            echo "Deployment commands completed."
