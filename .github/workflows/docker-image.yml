
name: WonderBooks CI-CD Docker Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Create backend Dockerfile
      - name: Create backend Dockerfile
        run: |
          cat > Backend/Dockerfile <<'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY . .
          EXPOSE 5000
          CMD ["node", "app.js"]
          EOF

      # 3. Create frontend Dockerfile
      - name: Create frontend Dockerfile
        run: |
          cat > frontend/Dockerfile <<'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci
          COPY . .
          EXPOSE 5173
          CMD ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
          EOF

      # 4. Build backend Docker image
      - name: Build backend image
        run: |
          docker build \
            -f Backend/Dockerfile \
            -t wonderbooks-backend:latest \
            ./Backend

      # 5. Build frontend Docker image
      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t wonderbooks-frontend:latest \
            ./frontend

      # 6. Save images for transfer
      - name: Save Docker images
        run: |
          docker save \
            wonderbooks-backend:latest \
            wonderbooks-frontend:latest \
            -o wonderbooks-images.tar

      # 7. Copy images to new EC2
      - name: Transfer images to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "wonderbooks-images.tar"
          target: "/home/ubuntu/"

      # 8. Deploy containers
      - name: Deploy Docker containers
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Loading Docker images..."
            sudo docker load \
              -i /home/ubuntu/wonderbooks-images.tar

            echo "Removing previous containers..."
            sudo docker rm -f wonderbooks-backend || true
            sudo docker rm -f wonderbooks-frontend || true

            echo "Starting backend on port 5000..."
            if [ -f /home/ubuntu/WonderBooks/Backend/.env ]; then
              sudo docker run -d \
                --name wonderbooks-backend \
                --restart unless-stopped \
                --env-file /home/ubuntu/WonderBooks/Backend/.env \
                -p 5000:5000 \
                wonderbooks-backend:latest
            else
              sudo docker run -d \
                --name wonderbooks-backend \
                --restart unless-stopped \
                -p 5000:5000 \
                wonderbooks-backend:latest
            fi

            echo "Starting frontend on port 5173..."
            sudo docker run -d \
              --name wonderbooks-frontend \
              --restart unless-stopped \
              -p 5173:5173 \
              wonderbooks-frontend:latest

            echo "Checking containers..."
            sleep 5
            sudo docker ps -a

            echo "Backend logs..."
            sudo docker logs --tail 50 wonderbooks-backend

            echo "Frontend logs..."
            sudo docker logs --tail 50 wonderbooks-frontend

            rm -f /home/ubuntu/wonderbooks-images.tar

            echo "WonderBooks deployment completed."
